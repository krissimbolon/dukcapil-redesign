name: One-time Next security upgrade

on:
  push:
    branches:
      - feat/content-migration-esri
    paths:
      - .github/workflows/upgrade-next-security.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/content-migration-esri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Align patched Next.js packages
        run: npm install next@16.3.5 eslint-config-next@16.3.5 --save-exact
      - name: Verify patched production dependency tree
        run: npm audit --omit=dev --audit-level=high
      - name: Commit dependency updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: align Next.js security packages at 16.3.5" || exit 0
          git push origin HEAD:feat/content-migration-esri
