name: One-time dependency cleanup

on:
  push:
    branches:
      - feat/content-migration-esri
    paths:
      - .github/workflows/audit-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/content-migration-esri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply non-breaking audit fixes
        run: npm audit fix
      - name: Verify all production advisories are cleared
        run: npm audit --omit=dev
      - name: Verify no high or critical advisories remain anywhere
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build
      - name: Remove one-time workflow
        run: rm -f .github/workflows/audit-fix.yml
      - name: Commit dependency cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/
          git commit -m "chore: apply non-breaking dependency audit fixes"
          git push origin HEAD:feat/content-migration-esri
